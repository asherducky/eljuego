<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Titan Pose Tool</title>
<style>:root{--ink:#e8e4f0;--dim:#a8a2b8;--gold:#f2c14e;--edge:#2a2636}body{background:#14111c;color:var(--ink);font:14px monospace;margin:0;padding:12px}h1{font-size:17px;margin:0 0 4px}p{margin:0 0 8px;color:var(--dim);max-width:800px}
#wrap{position:relative;width:768px;max-width:100%;aspect-ratio:256/150;box-shadow:0 0 0 3px var(--edge);touch-action:none}#wrap canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}#over{cursor:grab}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}button{font:inherit;color:var(--ink);background:#262034;border:0;box-shadow:inset 0 0 0 2px #3a3450;padding:6px 10px;cursor:pointer}button.on{background:var(--gold);color:#14111c}label{display:flex;gap:6px;align-items:center}input[type=range]{width:150px}#who{color:var(--gold)}textarea{width:768px;max-width:100%;height:64px;background:#0d0b14;color:var(--dim);border:0;box-shadow:inset 0 0 0 2px var(--edge);font:11px monospace}</style></head><body>
<h1>Titan pose tool</h1><p>Drag the dots. <b>Rotate</b> swings a joint around the one above it and keeps the limb's length. <b>Move</b> slides it anywhere. Click a dot, then use the sliders to make that part thicker or more muscular. When you like it, press Copy pose and paste it to me.</p>
<div id="wrap"><canvas id="art" width="256" height="150"></canvas><canvas id="over" width="768" height="450"></canvas></div>
<div class="bar"><button id="mRot" class="on">Rotate</button><button id="mMove">Move</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="bones" class="on">Dots on</button><button id="reset">Reset</button><button id="copy">Copy pose</button></div>
<div class="bar"><span id="who">Click a dot</span><label>Thickness <input id="rad" type="range" min="1" max="30" step=".5"></label><label>Muscle <input id="mus" type="range" min="-6" max="14" step=".5"></label><label id="hs">Fingers: spread <input id="spread" type="range" min="0" max="10" step=".5"></label><label id="hc">curl <input id="curl" type="range" min="0" max="10" step=".5"></label><button id="flip">Flip hand vertically</button><button id="palm">Show palm</button></div>
<textarea id="out" readonly aria-label="Pose text"></textarea>
<script>
const W=256,H=150,BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const hash=(x,y)=>{const v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v);};
const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),u=x-i,v=y-j,s=u*u*(3-2*u),t=v*v*(3-2*v);return (hash(i,j)*(1-s)+hash(i+1,j)*s)*(1-t)+(hash(i,j+1)*(1-s)+hash(i+1,j+1)*s)*t;};
const fbm=(x,y,o=4)=>{let a=.5,f=1,r=0,n=0;for(let i=0;i<o;i++){r+=a*vn(x*f,y*f);n+=a;a*=.5;f*=2.03;}return r/n;};
const cell=(x,y)=>{const i=Math.floor(x),j=Math.floor(y);let d1=9,d2=9;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const px=i+a+hash(i+a,j+b),py=j+b+hash(j+b,i+a),d=Math.hypot(px-x,py-y);if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}return d2-d1;};
const ramp=(R,v,x,y)=>{const t=BAYER[y&3][x&3]/16-.47,k=Math.max(0,Math.min(R.length-1,Math.round(v*(R.length-1)+t*.9)));return R[k];};
const px1=(g,x,y,c)=>{g.fillStyle=c;g.fillRect(x,y,1,1);};
function capsule(p,a,b,r0,r1,mat,noise){p.push({a,b,r0,r1,mat,noise:noise==null?2:noise});}
function paint(P,out,o){const x0=0,x1=W,y0=0,y1=H,w=W,h=H,D=new Float32Array(w*h).fill(99),M=new Int16Array(w*h).fill(-1);
  for(let i=0;i<P.length;i++){const q=P[i],ax=q.a[0],ay=q.a[1],bx=q.b[0],by=q.b[1],R=Math.max(q.r0,q.r1)+q.noise+2,minx=Math.max(x0,Math.floor(Math.min(ax,bx)-R)),maxx=Math.min(x1-1,Math.ceil(Math.max(ax,bx)+R)),miny=Math.max(y0,Math.floor(Math.min(ay,by)-R)),maxy=Math.min(y1-1,Math.ceil(Math.max(ay,by)+R)),dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;
    for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/l2)),d=Math.hypot(x-ax-dx*t,y-ay-dy*t)-(q.r0+(q.r1-q.r0)*t)+(o.fast?0:(fbm(x*.22+i,y*.22,3)-.5)*q.noise*2),k=y*w+x;if(d<D[k]){D[k]=d;M[k]=i;}}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=y*w+x;if(D[k]>0){if(D[k]<.9&&M[k]>=0)px1(out,x,y,'#040102');continue;}const g=(a,b)=>{const xx=Math.max(0,Math.min(w-1,a)),yy=Math.max(0,Math.min(h-1,b));return D[yy*w+xx];},nx=g(x+1,y)-g(x-1,y),ny=g(x,y+1)-g(x,y-1),nl=Math.hypot(nx,ny)||1,dep=Math.min(1,-D[k]/6),lit=(nx/nl*.55+ny/nl*.8);o.mat[P[M[k]].mat](out,x,y,.42+lit*.34*(1-dep*.55)+dep*.1,dep);}}
const RSTONE=['#0d0507','#1c0a0c','#2e1012','#451a1a','#5e2622','#7c3a30','#a05a48'],RFAR=['#080305','#100608','#1a0a0c','#26100f','#341614'];
let CRE=[];const flushCre=g=>{for(const [p,c,col] of CRE){const n=Math.ceil(Math.hypot(c[0]-p[0],c[1]-p[1]))||1;g.fillStyle=col;for(let i=0;i<=n;i++)g.fillRect(Math.round(p[0]+(c[0]-p[0])*i/n),Math.round(p[1]+(c[1]-p[1])*i/n),1,1);}CRE=[];};
const MAT={palm(g,x,y,s){px1(g,x,y,ramp(['#1a0a0c','#2e1214','#47201e','#5e2e28','#7c4238'],s*.95+.08,x,y));},near(g,x,y,s,dep){const c=cell(x*.085+1,y*.085+4),t2=fbm(x*.22,y*.22,2),seam=fbm(x*.04+4,y*.04,3);if(c<.024){px1(g,x,y,seam>.57&&dep>.1?(hash(x,y)>.5?'#ff5a3c':'#d8301e'):RSTONE[0]);return;}px1(g,x,y,ramp(RSTONE,s*.98+(t2-.5)*.14,x,y));},far(g,x,y,s){const c=cell(x*.085+1,y*.085+4);px1(g,x,y,c<.024?RFAR[0]:ramp(RFAR,s*.8,x,y));},horn(g,x,y,s){px1(g,x,y,ramp(['#1a0a0c','#3a1c18','#6a3c30','#a07a5c','#d4b48c'],s*.95+.05,x,y));}};
// the skeleton: x, y, r is thickness, m is how much muscle swells on the bone from its parent, p is the parent joint
const START={hip:{x:186,y:90,r:15,n:'Hips'},waist:{x:178,y:76,r:15,m:0,p:'hip',n:'Waist'},chest:{x:170,y:54,r:24,m:0,p:'waist',n:'Chest'},back:{x:178,y:44,r:21,m:0,p:'chest',n:'Upper back'},neck:{x:155,y:36,r:12,m:0,p:'chest',n:'Neck'},head:{x:147,y:25,r:10,m:0,p:'neck',n:'Head'},
 nsh:{x:170,y:50,r:15,m:0,p:'chest',n:'Near shoulder'},nel:{x:160,y:86,r:9,m:6,p:'nsh',n:'Near elbow'},nwr:{x:145,y:110,r:7,m:4,p:'nel',n:'Near wrist'},nha:{x:144,y:124,r:7,m:0,p:'nwr',n:'Near hand',hand:1,sp:4.4,cu:3},
 fsh:{x:150,y:54,r:11,m:0,p:'chest',n:'Far shoulder'},fel:{x:124,y:74,r:8,m:4,p:'fsh',n:'Far elbow'},fwr:{x:103,y:92,r:6,m:3,p:'fel',n:'Far wrist'},fha:{x:94,y:100,r:6,m:0,p:'fwr',n:'Far hand',hand:1,sp:7,cu:1},
 nth:{x:192,y:92,r:15,m:0,p:'hip',n:'Near hip'},nkn:{x:172,y:112,r:11,m:3,p:'nth',n:'Near knee'},nan:{x:190,y:138,r:7,m:3,p:'nkn',n:'Near ankle'},nto:{x:172,y:146,r:4,m:0,p:'nan',n:'Near toes',foot:1},
 fth:{x:176,y:94,r:12,m:0,p:'hip',n:'Far hip'},fkn:{x:154,y:112,r:10,m:2,p:'fth',n:'Far knee'},fan:{x:165,y:136,r:7,m:2,p:'fkn',n:'Far ankle'},fto:{x:146,y:146,r:4,m:0,p:'fan',n:'Far toes',foot:1},
 hn1:{x:174,y:12,r:3.5,m:0,p:'head',n:'Horn'},hn2:{x:190,y:13,r:2.1,m:0,p:'hn1',n:'Horn bend'},hn3:{x:198,y:3,r:.4,m:0,p:'hn2',n:'Horn tip'}};
let J=JSON.parse(JSON.stringify(START)),sel=null,mode='rot',dots=true,T=0;try{const s=localStorage.getItem('titanpose');if(s){const o=JSON.parse(s);for(const k in o)if(J[k])Object.assign(J[k],o[k]);}}catch(e){}
const kids=k=>Object.keys(J).filter(c=>J[c].p===k),subtree=k=>[k,...kids(k).flatMap(subtree)];
const undoS=[],redoS=[],snap=()=>JSON.stringify(J);
const pt=k=>[J[k].x,J[k].y];
function bone(P,a,c,m){const A=J[a],C=J[c],mus=C.m||0,dx=C.x-A.x,dy=C.y-A.y,l=Math.hypot(dx,dy)||1,mid=[A.x+dx*.45-dy/l*mus*.28,A.y+dy*.45+dx/l*mus*.28],rm=(A.r+C.r)/2+mus*.55;capsule(P,[A.x,A.y],mid,A.r,rm,m,.15);capsule(P,mid,[C.x,C.y],rm,C.r,m,.15);}
function hand(P,k,m0){const w=J[J[k].p],h=J[k],a=Math.atan2(h.y-w.y,h.x-w.x),sp=(h.sp||4)*.075,cu=(h.cu||0)*.09,S=h.r/7,V=q=>h.vf?[q[0],2*h.y-q[1]]:q,m=m0,C=(p,c,r0,r1,mm,n)=>capsule(P,V(p),V(c),r0,r1,mm,n),L=(p,c,col)=>CRE.push([V(p),V(c),col]);capsule(P,[w.x,w.y],[h.x,h.y],w.r,h.r,m0,.1);if(h.palm)capsule(P,[h.x,h.y],[h.x,h.y],h.r*1.02,h.r*1.02,m,.05);for(let i=0;i<4;i++){const f=a+(i-1.5)*sp,kx=h.x+Math.cos(f)*h.r*.8,ky=h.y+Math.sin(f)*h.r*.8,j=[kx+Math.cos(f)*7*S,ky+Math.sin(f)*7*S],e=[j[0]+Math.cos(f+cu)*6*S,j[1]+Math.sin(f+cu)*6*S],tip=[e[0]+Math.cos(f+cu*2)*(h.palm?4:6)*S,e[1]+Math.sin(f+cu*2)*(h.palm?4:6)*S];C([kx,ky],j,2.6*S,2.2*S,m,.05);C(j,e,2.2*S,1.7*S,m,.05);C(e,tip,1.6*S,.25,'horn',.03);if(h.palm){const nx=-Math.sin(f)*2.4*S,ny=Math.cos(f)*2.4*S;for(const q of [[kx,ky],j])L([q[0]-nx,q[1]-ny],[q[0]+nx,q[1]+ny],'#030102');}}const fs0=h.palm?1.1:-1.1,f=a+fs0,th=[h.x+Math.cos(f)*10*S,h.y+Math.sin(f)*10*S];C([h.x,h.y],th,2.8*S,2*S,m,.05);C(th,[th[0]+Math.cos(f+.4*Math.sign(fs0))*6*S,th[1]+Math.sin(f+.4*Math.sign(fs0))*6*S],1.6*S,.25,'horn',.03);if(h.palm){const nx=-Math.sin(a),ny=Math.cos(a),ux=Math.cos(a),uy=Math.sin(a),r=h.r;L([h.x+ux*r*.45-nx*r*.65,h.y+uy*r*.45-ny*r*.65],[h.x+ux*r*.25+nx*r*.7,h.y+uy*r*.25+ny*r*.7],'#030102');L([h.x-ux*r*.1-nx*r*.5,h.y-uy*r*.1-ny*r*.5],[h.x-ux*r*.3+nx*r*.55,h.y-uy*r*.3+ny*r*.55],'#040203');L([h.x+ux*r*.1+nx*r*.15,h.y+uy*r*.1+ny*r*.15],[h.x-ux*r*.65+nx*r*.45,h.y-uy*r*.65+ny*r*.45],'#040203');}}
function foot(P,k,m){const a=J[J[k].p],t=J[k];capsule(P,[a.x,a.y],[t.x,t.y],a.r,t.r,m,.1);for(let i=0;i<3;i++)capsule(P,[t.x,t.y+(i-1)*1.5],[t.x-9,t.y+2+(i-1)*.8],2,.3,'horn',.03);}
const BACK=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),SKY=['#140406','#28080a','#440e0e','#661614','#8c2a1c','#b04a2c','#d07a44'];for(let y=0;y<H;y++)for(let x=0;x<W;x++)px1(g,x,y,ramp(SKY,Math.pow(y/116,1.1)*.8+.2*fbm(x*.02,y*.04+9,4)-.1,x,y));['#5a1a18','#380e10','#200809'].forEach((col,i)=>{g.fillStyle=col;for(let x=0;x<W;x++){const tt=112+i*8-fbm(x*(.02+i*.012)+i*9,9,4)*(50-i*12);g.fillRect(x,tt,1,H-tt);}});for(let y=130;y<H;y++)for(let x=0;x<W;x++)px1(g,x,y,ramp(['#060806','#0e120c','#1a2014','#2a3020'],.1+fbm(x*.04,y*.5,3)*.5,x,y));return c;})();
const art=document.getElementById('art').getContext('2d');
function draw(fast){art.drawImage(BACK,0,0);art.fillStyle='#050408';art.fillRect(41,124,7,17);art.fillStyle='#2f6f78';art.fillRect(42,125,5,3);art.fillStyle='#c98a5a';art.fillRect(43,128,3,2);art.fillStyle='#55505a';art.fillRect(42,131,5,5);art.fillStyle='#2f6f78';art.fillRect(42,136,2,4);art.fillRect(45,136,2,4);
  const lay=fn=>{const P=[];fn(P);paint(P,art,{mat:MAT,fast});flushCre(art);};
  lay(P=>{bone(P,'fsh','fel','far');bone(P,'fel','fwr','far');hand(P,'fha','far');bone(P,'fth','fkn','far');bone(P,'fkn','fan','far');foot(P,'fto','far');const h=J.head;capsule(P,[h.x-4,h.y-9],[h.x-10,h.y-19],3.2,2.2,'far',.08);capsule(P,[h.x-10,h.y-19],[h.x-6,h.y-28],2.2,.4,'far',.05);});
  lay(P=>{bone(P,'nth','nkn','near');bone(P,'nkn','nan','near');foot(P,'nto','near');});
  lay(P=>{bone(P,'hip','waist','near');bone(P,'waist','chest','near');bone(P,'chest','back','near');bone(P,'chest','neck','near');const b=J.back,w=J.waist;for(let i=0;i<6;i++){const q=i/5,x=b.x+(w.x-b.x)*q+b.r*.85,y=b.y-b.r*.55+(w.y-b.y+b.r*.55)*q,hh=11-i;capsule(P,[x,y],[x+hh*.8,y-hh*.7],3,.4,'horn',.08);}});
  lay(P=>{const h=J.head,n=J.neck;capsule(P,[n.x,n.y],[h.x+4,h.y],n.r*.85,h.r,'near',.1);capsule(P,[h.x+5,h.y-1],[h.x-5,h.y],h.r,h.r*.82,'near',.08);capsule(P,[h.x+3,h.y-8],[h.x-12,h.y-4],4,2.8,'near',.05);capsule(P,[h.x-7,h.y+3],[h.x-17,h.y+6],5,3.4,'near',.05);capsule(P,[h.x+1,h.y+14],[h.x-13,h.y+16],6.5,4.4,'near',.05);capsule(P,[h.x+10,h.y-5],pt('hn1'),4.8,J.hn1.r,'horn',.08);capsule(P,pt('hn1'),pt('hn2'),J.hn1.r,J.hn2.r,'horn',.06);capsule(P,pt('hn2'),pt('hn3'),J.hn2.r,J.hn3.r,'horn',.04);});
  lay(P=>{const s=J.nsh;capsule(P,[s.x,s.y],[s.x,s.y],s.r,s.r,'near',.12);bone(P,'nsh','nel','near');capsule(P,pt('nel'),pt('nel'),J.nel.r,J.nel.r,'near',.06);bone(P,'nel','nwr','near');hand(P,'nha','near');});
  const h=J.head;art.fillStyle='#ff5a3c';art.fillRect(h.x-13,h.y-2,10,2);art.fillStyle='#ffc49a';art.fillRect(h.x-12,h.y-2,5,1);art.fillStyle='#040102';art.fillRect(h.x-18,h.y+8,20,4);art.fillStyle='#7a1414';art.fillRect(h.x-14,h.y+10,14,2);art.fillStyle='#e0d0b0';for(let i=0;i<8;i++){art.fillRect(h.x-17+i*2.4,h.y+8,1,2);art.fillRect(h.x-16+i*2.4,h.y+11,1,1);}}
const ov=document.getElementById('over'),og=ov.getContext('2d');
function overlay(){og.clearRect(0,0,768,450);if(!dots)return;for(const k in J){const j=J[k];if(j.p){const p=J[j.p];og.strokeStyle='rgba(255,255,255,.3)';og.lineWidth=2;og.beginPath();og.moveTo(p.x*3,p.y*3);og.lineTo(j.x*3,j.y*3);og.stroke();}}for(const k in J){const j=J[k];og.fillStyle=k===sel?'#f2c14e':k.startsWith('f')&&k!=='fto'?'#6fb7e8':'#ffffff';og.fillRect(j.x*3-5,j.y*3-5,10,10);og.fillStyle='#000';og.fillRect(j.x*3-2,j.y*3-2,4,4);}}
let pending=null;function queue(fast){if(pending)return;pending=requestAnimationFrame(()=>{pending=null;draw(fast);overlay();});}
let hq;const settle=()=>{clearTimeout(hq);hq=setTimeout(()=>{draw(false);overlay();save();},180);};
function save(){const o={};for(const k in J){o[k]={x:Math.round(J[k].x),y:Math.round(J[k].y),r:J[k].r};if(J[k].m!=null)o[k].m=J[k].m;if(J[k].hand){o[k].sp=J[k].sp;o[k].cu=J[k].cu;if(J[k].vf)o[k].vf=1;if(J[k].palm)o[k].palm=1;}}const s=JSON.stringify(o);document.getElementById('out').value=s;try{localStorage.setItem('titanpose',s);}catch(e){}}
const $=id=>document.getElementById(id),rad=$('rad'),mus=$('mus'),spread=$('spread'),curl=$('curl');
function selUI(){$('who').textContent=sel?J[sel].n:'Click a dot';const j=sel&&J[sel];rad.disabled=!j;mus.disabled=!j||j.m==null;if(j){rad.value=j.r;mus.value=j.m||0;}$('hs').style.display=$('hc').style.display=$('flip').style.display=$('palm').style.display=j&&j.hand?'flex':'none';if(j&&j.hand){spread.value=j.sp;curl.value=j.cu;}}
const local=e=>{const r=ov.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];};
let drag=null;ov.addEventListener('pointerdown',e=>{const [x,y]=local(e);let best=null,bd=6;for(const k in J){const d=Math.hypot(J[k].x-x,J[k].y-y);if(d<bd){bd=d;best=k;}}sel=best;selUI();overlay();if(!best)return;undoS.push(snap());redoS.length=0;ov.setPointerCapture(e.pointerId);drag={k:best};});
ov.addEventListener('pointermove',e=>{if(!drag)return;const [x,y]=local(e),j=J[drag.k],par=j.p&&J[j.p],sub=subtree(drag.k);if(mode==='rot'&&par){const a0=Math.atan2(j.y-par.y,j.x-par.x),a1=Math.atan2(y-par.y,x-par.x),da=a1-a0,c=Math.cos(da),s=Math.sin(da);for(const k of sub){const q=J[k],dx=q.x-par.x,dy=q.y-par.y;q.x=par.x+dx*c-dy*s;q.y=par.y+dx*s+dy*c;}}else{const dx=x-j.x,dy=y-j.y;for(const k of sub){J[k].x+=dx;J[k].y+=dy;}}queue(true);settle();});
ov.addEventListener('pointerup',()=>{drag=null;});
for(const [el,key] of [[rad,'r'],[mus,'m'],[spread,'sp'],[curl,'cu']]){el.addEventListener('pointerdown',()=>{undoS.push(snap());redoS.length=0;});el.addEventListener('input',()=>{if(!sel)return;J[sel][key]=+el.value;queue(true);settle();});}
$('flip').onclick=()=>{if(!sel||!J[sel].hand)return;undoS.push(snap());J[sel].vf=!J[sel].vf;draw(false);overlay();save();};
$('palm').onclick=()=>{if(!sel||!J[sel].hand)return;undoS.push(snap());J[sel].palm=!J[sel].palm;draw(false);overlay();save();};
$('mRot').onclick=()=>{mode='rot';$('mRot').className='on';$('mMove').className='';};$('mMove').onclick=()=>{mode='move';$('mMove').className='on';$('mRot').className='';};
const apply=s=>{J=JSON.parse(s);selUI();draw(false);overlay();save();};
$('undo').onclick=()=>{if(undoS.length){redoS.push(snap());apply(undoS.pop());}};$('redo').onclick=()=>{if(redoS.length){undoS.push(snap());apply(redoS.pop());}};
