<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Devil Fight Models</title>
<style>body{background:#14111c;color:#e8e4f0;font:14px monospace;margin:0;padding:16px}h1{font-size:18px;margin:0}h2{font-size:15px;color:#f2c14e;margin:18px 0 4px}p{margin:2px 0 8px;color:#a8a2b8;max-width:800px}canvas{image-rendering:pixelated;display:block;max-width:100%;box-shadow:0 0 0 3px #2a2636}</style></head><body>
<h1>Devil fight models: painted draft</h1><p id="st">Painting...</p><div id="out"></div>
<script>
const W=256,H=150,BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const hash=(x,y)=>{const v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v);};
const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),u=x-i,v=y-j,s=u*u*(3-2*u),t=v*v*(3-2*v);return (hash(i,j)*(1-s)+hash(i+1,j)*s)*(1-t)+(hash(i,j+1)*(1-s)+hash(i+1,j+1)*s)*t;};
const fbm=(x,y,o=4)=>{let a=.5,f=1,r=0,n=0;for(let i=0;i<o;i++){r+=a*vn(x*f,y*f);n+=a;a*=.5;f*=2.03;}return r/n;};
// distance to the nearest cell edge, for cracked plates of rock
const cell=(x,y)=>{const i=Math.floor(x),j=Math.floor(y);let d1=9,d2=9;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const px=i+a+hash(i+a,j+b),py=j+b+hash(j+b,i+a),d=Math.hypot(px-x,py-y);if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}return d2-d1;};
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const ramp=(R,v,x,y)=>{const t=BAYER[y&3][x&3]/16-.47,k=Math.max(0,Math.min(R.length-1,Math.round(v*(R.length-1)+t*.9)));return R[k];};
const ROCK=['#0a0506','#180a0a','#2a1210','#431d17','#63302a','#8b4e3a','#b37c5a'],ASH=['#2a2622','#4a443c','#6e675a','#98907e','#c7bfa8','#e8e0c8'],CLOTH=['#07060b','#110e18','#1d1826','#2c2638','#40384e','#5d5470'],PORC=['#3a3440','#6a6270','#9a92a0','#c9c2cc','#e8e2e4','#fbf7f2'],WOOD=['#120a08','#241510','#3a2318','#553524','#7a4f36','#a0704c'];
// a body is a list of tapered capsules; the painter turns the shape into lit, textured pixels
function capsule(p,a,b,r0,r1,mat,noise){p.push({a,b,r0,r1,mat,noise:noise==null?2:noise});}
function paint(P,out,o){const x0=Math.max(0,o.x0),x1=Math.min(W,o.x1),y0=Math.max(0,o.y0),y1=Math.max(y0+1,Math.min(H,o.y1)),w=x1-x0,h=y1-y0,D=new Float32Array(w*h).fill(99),M=new Int16Array(w*h).fill(-1);
  for(let i=0;i<P.length;i++){const q=P[i],ax=q.a[0],ay=q.a[1],bx=q.b[0],by=q.b[1],R=Math.max(q.r0,q.r1)+q.noise+2,minx=Math.max(x0,Math.floor(Math.min(ax,bx)-R)),maxx=Math.min(x1-1,Math.ceil(Math.max(ax,bx)+R)),miny=Math.max(y0,Math.floor(Math.min(ay,by)-R)),maxy=Math.min(y1-1,Math.ceil(Math.max(ay,by)+R)),dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;
    for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/l2)),d=Math.hypot(x-ax-dx*t,y-ay-dy*t)-(q.r0+(q.r1-q.r0)*t)+(fbm(x*.22+i,y*.22,3)-.5)*q.noise*2,k=(y-y0)*w+x-x0;if(d<D[k]){D[k]=d;M[k]=i;}}}
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const k=(y-y0)*w+x-x0;if(D[k]>0){if(D[k]<.9&&M[k]>=0&&o.rim){out.fillStyle=o.rim;out.fillRect(x,y,1,1);}continue;}
    const g=(a,b)=>{const xx=Math.max(0,Math.min(w-1,a-x0)),yy=Math.max(0,Math.min(h-1,b-y0));return D[yy*w+xx];},nx=g(x+1,y)-g(x-1,y),ny=g(x,y+1)-g(x,y-1),nl=Math.hypot(nx,ny)||1,dep=Math.min(1,-D[k]/6),lit=(-nx/nl*(-.55)+-ny/nl*(-.8));
    const q=P[M[k]],shade=.42+lit*.34*(1-dep*.55)+dep*.1;o.mat[q.mat](out,x,y,shade,dep);}}
function drawLine(g,a,b,c){const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1]))||1;g.fillStyle=c;for(let i=0;i<=n;i++){const q=i/n;g.fillRect(Math.round(a[0]+(b[0]-a[0])*q),Math.round(a[1]+(b[1]-a[1])*q),1,1);}}
const hero=(g,x,y)=>{g.fillStyle='#050408';g.fillRect(x+1,y,7,17);g.fillStyle='#2f6f78';g.fillRect(x+2,y+1,5,3);g.fillStyle='#c98a5a';g.fillRect(x+3,y+4,3,2);g.fillStyle='#55505a';g.fillRect(x+2,y+7,5,5);g.fillStyle='#2f6f78';g.fillRect(x+2,y+12,2,4);g.fillRect(x+5,y+12,2,4);};

/* ===== The Colossus: a walking, ruined giant, in the spirit of your reference but a devil ===== */
const colMat={rock(g,x,y,s,dep){const c=cell(x*.17+7,y*.17),tex=fbm(x*.3,y*.3,4),top=fbm(x*.09+3,y*.09,3),ember=c<.035&&dep>.2&&fbm(x*.06,y*.06+9,3)>.58;if(ember){g.fillStyle=hash(x,y)>.5?'#ff5a3c':'#c42828';g.fillRect(x,y,1,1);return;}if(top>.53&&s>.42){g.fillStyle=ramp(ASH,s*1.05+(tex-.5)*.5-.1,x,y);g.fillRect(x,y,1,1);return;}const v=s*.86+(tex-.5)*.42-(c<.09?.2:0);g.fillStyle=ramp(ROCK,v,x,y);g.fillRect(x,y,1,1);},
  bone(g,x,y,s){g.fillStyle=ramp(ASH,s*.9+.1+(fbm(x*.4,y*.4,2)-.5)*.3,x,y);g.fillRect(x,y,1,1);},
  dark(g,x,y,s){g.fillStyle=ramp(ROCK,s*.32,x,y);g.fillRect(x,y,1,1);}};
function colossusBody(t){const P=[],sw=Math.sin(t*.25),br=Math.sin(t*.5)*.5,cx=165;
  const lim=(pts,r,mat='rock',n=2)=>{for(let i=0;i<pts.length-1;i++)capsule(P,pts[i],pts[i+1],r[i],r[i+1],mat,n);};
  // far arm and leg first, so they sit behind the body
  lim([[183,46+br],[204,72],[222+sw,100],[224+sw*1.5,112]],[8,6,4.6,4.5]);
  lim([[172,80],[182,110],[189,141]],[8,5,5]);lim([[189,141],[200,145]],[5,3]);
  lim([[158,80],[150,110],[146,141]],[8,5,5]);lim([[146,141],[134,145]],[5,3]);
  capsule(P,[cx,70],[cx,82],11,9,'rock',3);capsule(P,[cx,40+br],[cx,70],17,11,'rock',3);capsule(P,[147,42+br],[183,42+br],9,9,'rock',3);
  for(let i=0;i<5;i++){const a=[176+i*3,34+i*2+br],b=[186+i*4,20+i*4+br];capsule(P,a,b,2.6,.4,'bone',.5);}
  lim([[146,46+br],[128,74],[116-sw,102],[113-sw*1.5,114]],[8,6,4.6,4.5]);
  for(const [hx,hy,d] of [[113-sw*1.5,114,-1],[224+sw*1.5,112,1]])for(let i=0;i<4;i++){const a=[hx+(i-1.5)*2.5,hy+1],b=[hx+(i-1.5)*3.4+d,hy+9],c=[hx+(i-1.5)*4+d*2,hy+17];capsule(P,a,b,1.8,1.4,'rock',.5);capsule(P,b,c,1.3,.3,'bone',.2);}
  capsule(P,[cx,20],[cx,30+br*.5],9,7,'rock',1.5);capsule(P,[cx-1,31+br*.5],[cx-1,37+br*.5],6,4,'rock',1);
  for(const d of [-1,1]){const a=[cx+d*7,18],b=[cx+d*14,8],c=[cx+d*16,-2],e=[cx+d*12,-10];capsule(P,a,b,3.6,2.6,'rock',1);capsule(P,b,c,2.6,1.6,'rock',.5);capsule(P,c,e,1.6,.3,'bone',.2);}
  capsule(P,[cx,18],[cx,28],11,9,'rock',1.2);
  for(const q of P){q.a=[q.a[0],15+q.a[1]*.88];q.b=[q.b[0],15+q.b[1]*.88];}
  return P;}
function drawColossus(g,t){const P=colossusBody(t);
  // a dead crown of burnt branches, like the tree on your reference's head
  const branch=(x,y,a,l,d)=>{const x2=x+Math.cos(a)*l,y2=y+Math.sin(a)*l;drawLine(g,[x,y],[x2,y2],d>2?'#120808':'#2a1210');if(d>0){branch(x2,y2,a-.45-hash(x,d)*.3,l*.72,d-1);branch(x2,y2,a+.4+hash(d,y)*.3,l*.7,d-1);}else if(hash(x2,y2)>.45){g.fillStyle=(Math.floor(t)+Math.floor(x2))%3?'#c42828':'#ff5a3c';g.fillRect(Math.round(x2),Math.round(y2),1,1);}};
  for(let i=0;i<5;i++)branch(165+(i-2)*5,24,-1.57+(i-2)*.32,6,3);
  paint(P,g,{x0:95,x1:245,y0:0,y1:150,rim:'#050404',mat:colMat});
  // burning eyes and a split mouth
  const y=37+Math.sin(t*.5)*.25;if(Math.floor(t)%14!==0){g.fillStyle='#ffe9c4';g.fillRect(160,y,4,1);g.fillRect(168,y,4,1);g.fillStyle='#ff5a3c';g.fillRect(159,y+1,3,1);g.fillRect(170,y+1,3,1);}
  g.fillStyle='#050404';g.fillRect(160,y+7,12,3);g.fillStyle='#c7bfa8';for(let i=0;i<6;i++){g.fillRect(161+i*2,y+7,1,1);g.fillRect(161+i*2,y+9,1,1);}
  // chains and roots hanging off him
  for(const [a,b,l] of [[136,68,24],[126,84,18],[214,86,20],[176,70,28],[154,70,30],[190,100,16]]){for(let i=0;i<l;i++){const xx=a+Math.sin(i*.35+t*.3+a)*(i/12);g.fillStyle=i%3?'#120808':'#55413a';g.fillRect(Math.round(xx),b+i,1,1);}}}
function colBack(){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),SKY=['#120a0a','#2a1210','#4a1f14','#70331c','#96552c','#bb8348','#d9ae72'];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=Math.pow(y/104,1.25)*.82+.14*fbm(x*.02,y*.05,4)-.08;g.fillStyle=ramp(SKY,v,x,y);g.fillRect(x,y,1,1);}
  const layer=(by,hh,col,sc,sd)=>{g.fillStyle=col;for(let x=0;x<W;x++){const tt=by-fbm(x*sc+sd,sd,4)*hh,dead=hash(Math.floor(x/9),sd)>.55&&x%9===4;g.fillRect(x,tt-(dead?hh*.8:0),1,H-tt);}};
  layer(112,46,'#7a4a2a',.018,1);layer(120,34,'#54301f',.03,2);layer(128,22,'#351c14',.05,3);
  // the ground: dark ash and a sheet of still water
  for(let y=128;y<H;y++)for(let x=0;x<W;x++){const r=fbm(x*.05,y*.5,3),v=.1+(y-128)/22*.05+r*.25;g.fillStyle=ramp(['#0a0606','#160c0a','#2a1610','#452618','#6a3c22'],v,x,y);g.fillRect(x,y,1,1);}
  // an overhang and hanging vines framing the top left
  g.fillStyle='#070404';for(let x=0;x<92;x++){const hh=38*Math.pow(1-x/92,1.3)+fbm(x*.15,5,3)*14;g.fillRect(x,0,1,hh);}for(let i=0;i<9;i++){const x=6+i*9,l=26+hash(i,2)*70;for(let k=0;k<l;k++)g.fillRect(Math.round(x+Math.sin(k*.09+i)*2.2),k+18,1,1);}
  return c;}

/* ===== The Veiled: a marionette on strings of her own hair, cracked porcelain and torn cloth ===== */
const veilMat={cloth(g,x,y,s,dep){const f=fbm(x*.14,y*.05,4),fold=Math.sin(x*.9+f*7)*.16;g.fillStyle=ramp(CLOTH,s*.85+fold+(f-.5)*.25,x,y);g.fillRect(x,y,1,1);},
  porc(g,x,y,s){const c=cell(x*.2+3,y*.2+5);g.fillStyle=c<.04?'#2a2430':ramp(PORC,s*1.05+.16,x,y);g.fillRect(x,y,1,1);},
  wood(g,x,y,s){g.fillStyle=ramp(WOOD,s*.8+(fbm(x*.1,y*.6,3)-.5)*.5,x,y);g.fillRect(x,y,1,1);},
  hairm(g,x,y,s){g.fillStyle=ramp(CLOTH,s*.3+(Math.sin(x*1.7)*.1),x,y);g.fillRect(x,y,1,1);}};
function puppet(g,cx,t,faded){const sw=Math.sin(t*.22)*5,sw2=Math.sin(t*.22-.7)*4,sw3=Math.sin(t*.22-1.3)*6,hy=38+Math.sin(t*.44)*1,tilt=Math.sin(t*.13)*1.5+3,hx=cx+sw,P=[];
  const J=(a,b,r0,r1,m='wood')=>capsule(P,a,b,r0,r1,m,.4),K=(p,r)=>capsule(P,p,p,r,r,'porc',.1);
  const sh=[hx,hy+13],hipx=hx+sw2*.3,hip=[hipx,hy+42];
  // limbs hang wrong: elbows bent out, one knee drawn up by its string
  const la0=[hx-11,hy+15],la1=[hx-19+sw2*.3,hy+33],la2=[hx-16+sw3,hy+52],ra0=[hx+11,hy+15],ra1=[hx+23+sw2*.3,hy+24],ra2=[hx+28+sw3*.8,hy+44];
  const ll0=[hipx-5,hy+46],ll1=[hipx-8+sw2*.2,hy+68],ll2=[hipx-7+sw3*.6,hy+92],rl0=[hipx+5,hy+46],rl1=[hipx+13,hy+60],rl2=[hipx+10+sw3*.4,hy+82];
  J(la0,la1,2.6,2);J(la1,la2,2,1.6);J(ll0,ll1,3.2,2.4);J(ll1,ll2,2.4,1.8);J(rl0,rl1,3.2,2.4);J(rl1,rl2,2.4,1.8);
  // torn dress and veil
  capsule(P,[hx,hy+12],[hipx,hy+40],10,8,'cloth',1.5);for(let i=0;i<7;i++){const o=(i-3)*3.8,l=20+hash(i,3)*16;capsule(P,[hipx+o*.8,hy+38],[hipx+o*1.25+sw3*.4,hy+38+l],4.4,.6,'cloth',1.6);}
  capsule(P,[hx,hy-8],[hx-2,hy+24],13,6,'cloth',2.2);capsule(P,[hx+1,hy-6],[hx+11,hy+26],7,1,'cloth',2);capsule(P,[hx-3,hy-6],[hx-13,hy+28],7,1,'cloth',2);
  J(ra0,ra1,2.6,2);J(ra1,ra2,2,1.6);for(const p of [la1,la2,ra1,ra2,ll1,ll2,rl1,rl2])K(p,2.2);
  for(const [p,d] of [[la2,-1],[ra2,1]])for(let i=0;i<4;i++)J([p[0]+(i-1.5),p[1]+1],[p[0]+(i-1.5)*1.8+d,p[1]+10],.9,.2,'porc');
  for(const p of [ll2,rl2])J([p[0],p[1]+1],[p[0]+1,p[1]+7],1.7,1,'porc');
  paint(P,g,{x0:cx-52,x1:cx+52,y0:0,y1:150,rim:'#050408',mat:veilMat});
  // the porcelain face sits on top of the veil so it always reads
  const F=[];capsule(F,[hx,hy],[hx+tilt*.4,hy+5],7.6,6.2,'porc',.15);paint(F,g,{x0:cx-52,x1:cx+52,y0:0,y1:150,rim:'#050408',mat:veilMat});
  const fx=hx+tilt*.2,fy=hy;
  // the face: hollow eyes, a seam jaw hinged like a puppet
  g.fillStyle='#050408';g.fillRect(fx-4,fy-1,3,3);g.fillRect(fx+2,fy-1,3,3);if(!faded&&Math.floor(t)%11){g.fillStyle='#ff5a3c';g.fillRect(fx-3,fy,1,1);g.fillRect(fx+3,fy,1,1);}
  g.fillStyle='#2a2430';g.fillRect(fx-5,fy+3,1,5);g.fillRect(fx+5,fy+3,1,5);const open=(Math.sin(t*.09)>.7)?2:0;g.fillRect(fx-4,fy+5,9,1);if(open){g.fillStyle='#050408';g.fillRect(fx-4,fy+6,9,open);}for(let i=0;i<4;i++){g.fillStyle='#55505a';g.fillRect(fx-3+i*2,fy+3,1,1);}
  // strings: hair running up out of the scene to her head, wrists and one knee
  const str=(p,tx,c)=>drawLine(g,p,[tx,0],c);for(let s=0;s<15;s++){const o=(s/14-.5)*14;const c=s%3?'#2a2636':'#6f678a';for(let y=0;y<hy-6;y+=1){const q=y/(hy-6);g.fillStyle=c;g.fillRect(Math.round(cx+o*1.6*(1-q)+o*.6*q+sw*q+Math.sin(y*.2+s+t*.2)*.6*(1-q)),y,1,1);}}
  str(la2,cx-30,'#a39da8');str(ra2,cx+34,'#a39da8');str(rl1,cx+18,'#a39da8');str(la1,cx-40,'#55505a');
  // loose hair falling around her
  for(const s of [0,1,2,7,8,9]){const x0=hx+(s-4.5)*2.9;for(let i=0;i<34+s%3*10;i++){const q=i/50;g.fillStyle=s%3?'#050408':'#1d1826';g.fillRect(Math.round(x0+(s-4.5)*q*2+Math.sin(q*6+t*.2+s)*q*4),hy+5+i,1,1);}}}
function veilBack(){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),SKY=['#050408','#0b0810','#14101b','#1f1928','#2c2436','#3a3045'];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=Math.hypot((x-170)/120,(y-60)/70),v=.62-d*.46+(fbm(x*.04,y*.04,4)-.5)*.3;g.fillStyle=ramp(SKY,v,x,y);g.fillRect(x,y,1,1);}
  // a dead puppet theatre: curtains on both sides and hanging, empty strings
  const CUR=['#0a0406','#180709','#2a0b0e','#3f1014','#56171b'];for(const side of [0,1])for(let x=0;x<70;x++){const X=side?W-1-x:x,edge=1-x/70;for(let y=0;y<H;y++){const lim=64+Math.sin(y*.05+side)*10+(y>110?(y-110)*.3:0);if(x>lim)continue;const fold=Math.sin(x*.42+Math.sin(y*.03)*1.4);g.fillStyle=ramp(CUR,.38+fold*.3+(edge-.5)*.2+(fbm(x*.1,y*.1,3)-.5)*.2,X,y);g.fillRect(X,y,1,1);}}
  for(let i=0;i<12;i++){const x=70+i*10+hash(i,1)*6,l=20+hash(i,5)*50;g.fillStyle='#2a2636';for(let y=0;y<l;y++)g.fillRect(Math.round(x),y,1,1);}
  for(let y=128;y<H;y++)for(let x=0;x<W;x++){g.fillStyle=ramp(['#050408','#100c14','#1a1520','#272030'],.12+fbm(x*.03,y*.4,3)*.45-(y-128)*.004,x,y);g.fillRect(x,y,1,1);}
  return c;}

/* ===== Colossus, side view: walking left toward you, hunched, spine plates, one long arm reaching ===== */
function colossusSide(t){const P=[],s=Math.sin(t*.22),br=Math.sin(t*.44)*.6,L=(pts,r,m='rock',n=2)=>{for(let i=0;i<pts.length-1;i++)capsule(P,pts[i],pts[i+1],r[i],r[i+1],m,n);};
  // far limbs in shadow, drawn first
  L([[182,86],[208,112],[214,142]],[8,6,5],'dark');L([[214,142],[201,146]],[5,3],'dark');
  L([[160,50+br],[134,74],[120+s,90]],[7,5,4],'dark');for(let i=0;i<3;i++)capsule(P,[120+s,91],[112+s+i*3,103],1.6,.3,'dark',.3);
  // hips, a hunched back and a low-slung neck
  capsule(P,[186,82],[176,62],13,15,'rock',3);capsule(P,[176,62],[156,44+br],16,13,'rock',3);capsule(P,[156,44+br],[136,38+br],10,8,'rock',2.5);
  // near leg striding forward, near arm hanging long
  L([[180,86],[152,110],[146,142]],[10,7,6]);L([[146,142],[128,146]],[6,3]);capsule(P,[148,139],[126,147],2,1,'bone',.3);
  L([[156,50+br],[126,76],[106+s*1.4,100]],[9,6.5,5]);
  const hx=106+s*1.4,hy=100;capsule(P,[hx,hy],[hx-5,hy+6],5.5,5,'rock',1);for(let i=0;i<4;i++){const a=[hx-6+i*2.5,hy+7],b=[hx-10+i*3,hy+16],c=[hx-15+i*3.4,hy+26];capsule(P,a,b,1.9,1.5,'rock',.5);capsule(P,b,c,1.4,.3,'bone',.2);}
