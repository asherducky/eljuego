<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>El Juego</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&text=0123456789%25%2B-%2F&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&text=SABCDEF&display=swap">
<style>
/* Layout: one pixel world. Notched, bevelled pixel frames for every panel and control; painted 256-wide pixel scenes on top of each screen. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#120f1c; --panel:#231d33; --panel2:#2e2742; --panel3:#3a3152; --edge:#0a0812; --hi:#4d4369; --lo:#17121f;
  --ink:#f4efe4; --dim:#c3bcd8; --mute:#8f88a8; --gold:#f2c14e; --gold-hi:#fff1a8; --gold-lo:#a8702a;
  --hp:#d04848; --mp:#3a7ad8; --xp:#9a6ad8; --good:#7ccf6a; --bad:#ef6262; --arc:#c08cff;
  --r0:#c9c2d6; --r1:#6fb7e8; --r2:#f2c14e; --r3:#c08cff; --r4:#ff8b45; --r5:#ff4fd8;
  --f:"Silkscreen","Pixelify Sans","Courier New",monospace;
  --notch:polygon(3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px),0 3px,3px 3px);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.35;-webkit-font-smoothing:none;font-smooth:never}
*{box-sizing:border-box}
img.spr,canvas.scene{image-rendering:pixelated;image-rendering:crisp-edges}
#amb,#pfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#amb{z-index:0}#pfx{z-index:35}
#fx{position:fixed;inset:0;pointer-events:none;z-index:36;overflow:hidden}
#vig{position:fixed;inset:0;pointer-events:none;z-index:34;box-shadow:inset 0 0 0 10px #8a1c1c,inset 0 0 0 20px rgba(138,28,28,.5),inset 0 0 0 30px rgba(138,28,28,.25);opacity:0;transition:opacity .4s steps(3)}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
h1{font-size:2.1rem;color:var(--gold);text-shadow:3px 3px 0 #000;letter-spacing:.02em;line-height:1}
h2{font-size:1.5rem;text-shadow:2px 2px 0 #000;line-height:1.1}
h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600}
p{margin:0}
.dim{color:var(--dim)} .small{font-size:.88rem}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold)}

/* pixel frames */
.px{background:var(--panel);clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 var(--hi),inset -6px -6px 0 0 var(--lo)}
.panel{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sub{background:var(--panel2);clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 #3f3659,inset -6px -6px 0 0 #1f1930;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.btn{font:inherit;font-size:1rem;font-weight:600;color:var(--ink);background:var(--panel3);border:0;padding:8px 16px;cursor:pointer;clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 #5a4f80,inset -6px -6px 0 0 #241d36;text-shadow:1px 1px 0 #000;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover:not(:disabled){background:#463c63}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 #241d36,inset -6px -6px 0 0 #5a4f80}
.btn:disabled{cursor:not-allowed;color:var(--mute);background:#221c31;box-shadow:inset 0 0 0 3px var(--edge);text-shadow:none}
.btn.primary{background:var(--gold);color:#2a1a08;text-shadow:none;box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 var(--gold-hi),inset -6px -6px 0 0 var(--gold-lo)}
.btn.primary:hover:not(:disabled){background:#ffd36a}
.btn.arcane{background:#7a3fb0;box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 #b07ce8,inset -6px -6px 0 0 #3b1f5a}
.btn.arcane:hover:not(:disabled){background:#8c4cc6}
.btn.danger{background:#7a2626;box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 #b04a4a,inset -6px -6px 0 0 #3e1212}
.btn.sm{font-size:.9rem;padding:5px 12px;min-height:34px}
button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;padding:2px 8px;background:var(--panel2);color:var(--dim);box-shadow:inset 0 0 0 2px var(--edge);white-space:nowrap}
.tag.good{color:var(--good)}.tag.gold{color:var(--gold)}.tag.bad{color:var(--bad)}.tag.arc{color:var(--arc)}.tag.rest{color:#ffd27a}
.note{padding:8px 12px;background:#17121f;box-shadow:inset 0 0 0 2px var(--edge);color:var(--dim)}
.grid2{display:grid;grid-template-columns:270px 1fr;gap:12px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}

/* bars */
.bar{position:relative;height:20px;background:#0a0812;border:3px solid var(--edge);min-width:0}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.3);transition:width .3s steps(6)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(10,8,18,.45) 10px 12px);pointer-events:none}
.bar span{position:relative;z-index:1;display:block;font-size:.72rem;line-height:14px;padding:0 5px;text-shadow:1px 1px 0 #000,-1px 0 0 #000;white-space:nowrap}
.bar.hp i{background:var(--hp)}.bar.mp i{background:var(--mp)}.bar.xp i{background:var(--xp)}.bar.gold i{background:var(--gold)}
.bar.thin{height:12px;border-width:2px}.bar.thin span{display:none}.bar.thin::after{background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(10,8,18,.45) 6px 8px)}

/* HUD */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{display:flex;align-items:center;gap:10px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-width:0}
.who{font-weight:600}
.bars{display:grid;grid-template-columns:repeat(3,minmax(90px,150px));gap:8px}
.goldc{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-weight:700;font-size:1.1rem;text-shadow:2px 2px 0 #000}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab .dot{display:inline-block;min-width:18px;padding:0 4px;background:var(--gold);color:#2a1a08;font-size:.75rem;text-align:center;text-shadow:none}
.tab.on{background:var(--gold);color:#2a1a08;text-shadow:none;box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 var(--gold-hi),inset -6px -6px 0 0 var(--gold-lo)}
.tab.on .dot{background:#2a1a08;color:var(--gold)}

/* scenes */
.scenewrap{position:relative;margin:0 auto;width:100%;line-height:0;box-shadow:0 0 0 3px var(--edge)}
canvas.scene{display:block;width:100%;height:auto}
.hot{position:absolute;background:transparent;border:0;cursor:pointer;padding:0;display:flex;align-items:flex-start;justify-content:center;font:inherit}
.hot span{line-height:1;font-size:.95rem;font-weight:700;color:var(--gold-hi);text-shadow:2px 2px 0 #000,-2px 0 0 #000,0 -2px 0 #000,2px 0 0 #000;white-space:nowrap;opacity:0;transform:translateY(6px);transition:opacity .15s steps(3),transform .15s steps(3);margin-top:-10px}
.hot:hover span,.hot:focus-visible span{opacity:1;transform:none}
.hot:focus-visible{outline:none}
.hot.dis{cursor:default}.hot.dis span{color:var(--mute)}
.lochead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.townbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

/* explore */
.areas{display:flex;flex-direction:column;gap:8px}
.area{font:inherit;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;color:var(--ink);cursor:pointer;padding:12px 14px;border:0;background:var(--panel);clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 var(--hi),inset -6px -6px 0 0 var(--lo)}
.area:hover:not(:disabled){background:var(--panel2)}
.area .an{font-weight:700}
.area .al{font-size:.8rem;color:var(--dim);grid-column:1}
.area .tag{grid-column:2;grid-row:1/3;align-self:center}
.area.on{background:#3a2f1a;box-shadow:inset 0 0 0 3px var(--gold),inset 6px 6px 0 0 #5a4626,inset -6px -6px 0 0 #241a0c}
.area:disabled,.area.ghost{cursor:not-allowed;color:var(--mute);background:#1a1527}
.area:disabled .al,.area.ghost .al{color:var(--mute)}
.mobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.mob{display:flex;gap:10px;align-items:center}
.mob small{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.dungeon{background:#2a2216;box-shadow:inset 0 0 0 3px var(--edge),inset 6px 6px 0 0 #4a3a20,inset -6px -6px 0 0 #17110a}

/* battle */
.stage{position:relative;margin:0 auto;width:100%;overflow:hidden;box-shadow:0 0 0 3px var(--edge)}
.stage canvas.scene{position:absolute;inset:0;width:100%;height:100%}
.stage .where{position:absolute;left:10px;top:8px;font-size:.85rem;padding:2px 8px;background:rgba(10,8,18,.8);box-shadow:inset 0 0 0 2px var(--edge);color:var(--gold);z-index:2}
.hero{position:absolute;left:8%;bottom:9%;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
.foesline{position:absolute;right:4%;bottom:9%;display:flex;align-items:flex-end;gap:2%;z-index:2;max-width:68%}
.foe{font:inherit;color:var(--ink);background:transparent;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0}
.foe .fname{font-size:.78rem;background:rgba(10,8,18,.8);padding:1px 6px;box-shadow:inset 0 0 0 2px var(--edge);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.foe.boss .fname{color:#ff8a7a}
.foe.elite .fname{color:var(--gold)}.foe.elite .body,.mob.elite img{filter:drop-shadow(2px 0 0 #f2c14e) drop-shadow(-2px 0 0 #f2c14e) drop-shadow(0 2px 0 #f2c14e) drop-shadow(0 -2px 0 #f2c14e)}
.ttl{color:var(--gold);font-size:.8em}.spire{display:flex;flex-direction:column;gap:6px}.quests{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.quest{display:flex;flex-direction:column;gap:6px}
.chatlog{height:220px;overflow-y:auto;background:#0e0b16;padding:8px 10px;box-shadow:inset 0 0 0 2px var(--edge);display:flex;flex-direction:column;gap:3px;word-break:break-word}
.cm{font-size:.9rem}.cm b{color:var(--gold);margin-right:4px}.cm.me b{color:#9cd2f2}.ct{color:var(--mute);font-size:.75rem;margin-right:6px}
.rfv{color:#6fb7e8;font-size:.85em}
.brow{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;background:#1c1630;padding:6px 8px;box-shadow:inset 0 0 0 2px var(--edge)}.brow .sb{display:flex;gap:4px}.bchips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.stats2{display:flex;flex-direction:column;gap:6px}.srow{display:grid;grid-template-columns:44px 34px 1fr auto;gap:8px;align-items:center;background:#1c1630;padding:6px 8px;box-shadow:inset 0 0 0 2px var(--edge)}
.srow .sk.gold{color:var(--gold)}.srow .sd{display:flex;flex-direction:column;min-width:0}.srow .sb{display:flex;gap:4px}
.beastgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.beast{display:flex;flex-direction:column;gap:6px}.beast.unseen img{filter:brightness(0) opacity(.5)}
.stars5 span{color:var(--mute)}.stars5 span.on{color:var(--gold)}.zoombar{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.chargrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}@media (max-width:860px){.chargrid{grid-template-columns:1fr}}
.lb{width:100%;border-collapse:collapse}.lb td{padding:4px 8px;border-bottom:2px solid var(--edge)}.lb td:first-child{width:2.5em;color:var(--mute)}.lb td:last-child{text-align:right;color:var(--gold)}.lb tr.me td{background:rgba(242,193,78,.12)}
.foe .bar{width:100%;min-width:80px}
.foe.dead{cursor:default}
.foe.dead img.spr{opacity:0;visibility:hidden}.foe.dead .fname{opacity:.4}
.foe.dead .bar,.foe.dead .sts{visibility:hidden}
.cursor{position:absolute;top:-46px;left:50%;transform:translateX(-50%);animation:cur .6s steps(2) infinite}
@keyframes cur{50%{transform:translate(-50%,-4px)}}
.idle{}
@keyframes idle{50%{transform:translateY(calc(-1 * var(--bob,3px)))}}
.foe.rage img.spr{filter:drop-shadow(3px 0 0 #c43c3c) drop-shadow(-3px 0 0 #c43c3c)}
.sts{display:flex;gap:3px;min-height:16px;flex-wrap:wrap;justify-content:center}
.st{display:inline-flex;align-items:center;gap:2px;font-size:.8rem;text-shadow:1px 1px 0 #000;background:#0e0b1ecc;border:1px solid #c8c0d8;padding:0 3px 0 1px;line-height:1.1}.st b{font-size:.85rem}.st .num{color:#c8c0d8;font-size:.7rem}
.cmdgrid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px}
.msg{font-size:.95rem;display:flex;flex-direction:column;gap:3px;min-height:120px}
.msg div{color:var(--dim)} .msg div:last-of-type{color:var(--ink)}
.msg .crit{color:var(--gold)!important} .msg .hurt{color:#ff9a8f!important} .msg .kill{color:var(--good)!important} .msg .boss{color:var(--bad)!important} .msg .buff{color:#9cc8ff!important}
.menu{display:flex;flex-direction:column;gap:2px}
.mi{font:inherit;font-size:1.05rem;color:var(--ink);background:transparent;border:0;text-align:left;padding:6px 8px 6px 26px;cursor:pointer;position:relative;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:38px}
.mi small{font-size:.8rem;color:var(--dim)}
.mi::before{content:"";position:absolute;left:8px;top:50%;margin-top:-6px;width:0;height:0;border:6px solid transparent;border-left:8px solid var(--gold);opacity:0}
.mi{transition:transform .1s steps(2)}
.mi:hover:not(:disabled):not(.off),.mi:focus-visible{outline:none;transform:translateX(10px)}
.mi:hover:not(:disabled)::before,.mi:focus-visible::before{opacity:1}
.mi:disabled{color:var(--mute);cursor:not-allowed}.mi:disabled small{color:var(--mute)}
.mi.s0{color:#ffb98a}.mi.s1{color:#9cc8ff}.mi.s2{color:#b6e36a}
.party{display:flex;flex-direction:column;gap:6px}
.log{background:#0e0b16;box-shadow:inset 0 0 0 3px var(--edge);padding:10px 12px;max-height:220px;overflow-y:auto;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.log div{color:var(--dim)}
.result{display:flex;flex-direction:column;gap:10px}
.result.win{background:#2a2216;box-shadow:inset 0 0 0 3px var(--gold),inset 6px 6px 0 0 #4a3a20,inset -6px -6px 0 0 #17110a}
.result.lose{background:#2a1416;box-shadow:inset 0 0 0 3px var(--bad),inset 6px 6px 0 0 #4a2024,inset -6px -6px 0 0 #170a0c}
.loot{display:flex;flex-wrap:wrap;gap:6px}

/* fx */
.fnum{position:fixed;font-family:var(--f);font-weight:700;font-size:26px;color:#fff;text-shadow:3px 0 0 #000,-3px 0 0 #000,0 3px 0 #000,0 -3px 0 #000,3px 3px 0 #000;white-space:nowrap}
.fnum.crit{color:var(--gold);font-size:36px}
.fnum.hurt{color:#ff6b5e}.fnum.heal{color:#8fe07a}.fnum.burn{color:#ff9a5c;font-size:21px}.fnum.poison{color:#b6e36a;font-size:21px}.fnum.bleed{color:#ff7a7a;font-size:21px}.fnum.miss{color:#9cd2f2;font-size:21px}
.fx-spr{position:fixed;image-rendering:pixelated}
.fx-bolt{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;box-shadow:0 0 0 3px rgba(0,0,0,.4)}
.coin{position:fixed;width:12px;height:12px}
.bossintro{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
.bossintro div{text-align:center;padding:18px 20px;background:#0a0812;width:100%;box-shadow:0 6px 0 #c43c3c,0 -6px 0 #c43c3c}
.bossintro .bn{font-size:clamp(2rem,7vw,3.8rem);font-weight:700;color:#ff6b5a;text-shadow:4px 4px 0 #000;line-height:1.05}
.reveal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,8,18,.85);padding:16px;cursor:pointer}
.reveal .rv{position:relative;width:min(330px,100%);display:flex;flex-direction:column;gap:10px}
.reveal .eyebrow{text-align:center}

/* character / skills */
.stats{display:flex;flex-direction:column;gap:6px}
.stat{display:grid;grid-template-columns:52px 40px 1fr auto;align-items:center;gap:10px;padding:8px 12px}
.stat .k{font-weight:700;color:var(--gold)}
.stat .v{font-size:1.2rem;font-weight:700}
.stat .d{font-size:.85rem;color:var(--dim)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.kv div{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--edge);padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.kv span{color:var(--dim)}
.school{display:flex;flex-direction:column;gap:8px}
.school.s0 h2{color:#ffb98a}.school.s1 h2{color:#9cc8ff}.school.s2 h2{color:#b6e36a}
.skill.locked{color:var(--mute)}.skill.locked p{color:var(--mute)}
.skill.eq{box-shadow:inset 0 0 0 3px var(--gold),inset 6px 6px 0 0 #3f3659,inset -6px -6px 0 0 #1f1930}
.skill .sh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.skill p{font-size:.88rem;color:var(--dim)}
.pips{display:flex;gap:3px}.pips i{width:10px;height:10px;background:#0a0812;box-shadow:inset 0 0 0 2px var(--gold-lo)}.pips i.on{background:var(--gold)}
.loadout{display:flex;flex-wrap:wrap;gap:6px}
.slot{min-width:110px;padding:6px 10px;font-size:.88rem;color:var(--mute);box-shadow:inset 0 0 0 2px var(--edge);background:#1a1527}
.slot.f{color:var(--ink);background:var(--panel2);box-shadow:inset 0 0 0 2px var(--gold-lo)}

/* items */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.item{background:var(--panel2);clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--rc),inset 6px 6px 0 0 #3f3659,inset -6px -6px 0 0 #1f1930;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}.r5{--rc:var(--r5)}
.item .ih{display:flex;gap:10px;align-items:center}
.icbox{flex:none;display:grid;place-items:center;background:#0e0b16;box-shadow:inset 0 0 0 2px var(--rc,var(--edge));padding:4px}
.item .iname{font-weight:700;color:var(--rc);line-height:1.15;text-shadow:1px 1px 0 #000}
.item .rar{font-size:.78rem;color:var(--dim)}
.item .ibase{font-size:.85rem}
.item ul{margin:0;padding:0;list-style:none;font-size:.9rem;display:flex;flex-direction:column;gap:1px}
.item li.empty{color:var(--mute)}
.item .iact{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;align-items:center}
.eqtag{font-size:.78rem;color:var(--gold)}
.price{color:var(--gold);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:6px}
.mats div{display:flex;align-items:center;gap:8px;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--edge);padding:6px 10px;font-size:.92rem}
.mats div b{margin-left:auto}
.empty-s{color:var(--mute)}
img.spr{max-width:none}
.tip[hidden]{display:none!important}

  for(const [tree,T] of Object.entries(TREES)){const p=tree==='melee'?'m':'g';
    STARS[p+'O']={x:0,y:0,k:'start',lv:1,c:'o',tree,n:`${T.n} Origin`,d:'Three paths branch from here.'};
    T.fams.forEach((f,fi)=>{const sb=SUBS[f];const id=k=>p+fi+k;
      for(const [k,dx,y,kind,slot,lv] of BR){const A=[-150,-90,-30][fi]*Math.PI/180,ux=Math.cos(A),uy=Math.sin(A),dist=(184-y)*.98,lat=dx*.8;
        const n={x:Math.round(ux*dist-uy*lat),y:Math.round(uy*dist+ux*lat),k:kind,lv,c:f,tree,fam:f};
        if(kind==='skill'){const s=sb.skills[+slot.slice(2)];Object.assign(n,{n:SK[s].n,d:SK[s].d,skill:s});}
        else if(kind==='passive'||kind==='key'){const q=sb[slot];Object.assign(n,{n:q[1],d:q[2],pid:q[0]});}
        else statNode(n,slot==='A'?sb.A:slot==='B'?sb.B:slot);
        STARS[id(k)]=n;}
      LINKS.push([p+'O',id('e')]);for(const [a,b] of BRL)LINKS.push([id(a),id(b)]);});
    for(const [hb,x,y,st,lv,a,b] of [['hA',87,128,'vit',2,'0k2','1s1'],['hB',169,128,'spd',2,'1k2','2s1'],['hC',87,76,'hp',6,'0k4','1st'],['hD',169,76,tree==='melee'?'crit':'mp',6,'1k4','2st']]){
      const P1=STARS[p+a],P2=STARS[p+b];const n={x:Math.round((P1.x+P2.x)*.4),y:Math.round((P1.y+P2.y)*.4),k:'stat',lv,c:'o',tree};statNode(n,st);STARS[p+hb]=n;LINKS.push([p+hb,p+a],[p+hb,p+b]);}}}
const has=id=>!!(S&&S.stars&&S.stars.includes(id));
const hasP=pid=>!!(S&&S.stars&&S.stars.some(id=>STARS[id]&&STARS[id].pid===pid));
const nbrs=id=>LINKS.filter(l=>l.includes(id)).map(l=>l[0]===id?l[1]:l[0]);
function recomputeSkills(){S.skills={};for(const id of S.stars){const s=STARS[id];if(s&&s.skill)S.skills[s.skill]=1;}S.equip=S.equip.filter(k=>S.skills[k]);}
function canLight(id){const s=STARS[id];return s&&s.k!=='start'&&!has(id)&&S.sp>=1&&S.lvl>=(s.lv||1)&&nbrs(id).some(has);}
function canUnlight(id){if(!has(id)||STARS[id].k==='start')return false;const rest=S.stars.filter(x=>x!==id);const seen=new Set(ORIGINS);const q=[...ORIGINS];
  while(q.length){const a=q.pop();for(const b of nbrs(a))if(rest.includes(b)&&!seen.has(b)){seen.add(b);q.push(b);}}return rest.every(x=>seen.has(x));}
const starTotal=()=>S.lvl+S.frags.length+S.chal.length+(S.qst||0);
const spLeft=()=>starTotal()-S.stars.filter(x=>!ORIGINS.includes(x)).length;
function applyStart(wep){S.stats={...BASESTATS};S.gear.weapon=mkItem('weapon',wep,0,0,[]);S.gear.armor=mkItem('armor','leather',0,0,[]);
  S.stars=[...ORIGINS];S.starTab=treeOf(famOf(wep));S.pts=3;S.sp=spLeft();S.equip=[];recomputeSkills();S.equip=Object.keys(S.skills);const d=derive();S.hp=d.maxHp;S.mp=d.maxMp;}
function respecAll(){S.stats={...BASESTATS};S.pts=3+3*(S.lvl-1);S.stars=[...ORIGINS];S.sp=spLeft();recomputeSkills();clampVitals();}

  const r=Math.random();let rar=r<.6?0:r<.87?1:r<.97?2:3;rar=Math.min(hi,Math.max(lo,rar));if(rar<hi&&S&&S.named&&chance(derive().luck))rar++;

        if(S.flags.god)dmg=0;S.hp=Math.max(0,S.hp-dmg);tot+=dmg;fx('impact',{t:'p',el:x.el||'phys',st:'claw'});fx('hit',{t:'p'});fx('num',{t:'p',txt:dmg+(x.c?'!':''),cls:x.c?'crit':'hurt'});fx('hp',{t:'p',hp:S.hp,max:d.maxHp,flash:1});fxAt+=120;if(S.hp<=0)break;}
      if(hits.length)log(`${e.n} hits you ${hits.length>1?hits.length+' times ':''}for ${tot}.`,'hurt');stUnP(c,p.st||{});
      if(tot>0&&S.hp>0){if(d.thorns){const r=Math.max(1,Math.round(tot*d.thorns/100));counter.push({d:r,el:'phys',k:'Thorns'});fx('num',{t:0,txt:r,cls:'dmg'});log(`Thorns deal ${r} back.`,'buff');}
        if(c.ps.riposte||(WP&&WP.riposte&&chance(WP.riposte))){c.duelHits=[];fxAt+=160;fx('hlunge');hit(e,.7,{label:'You riposte'});counter.push(...c.duelHits.map(x=>({...x,k:'Riposte'})));c.duelHits=[];}}}
    for(const k of ['veil','riposte'])if(c.ps[k]&&--c.ps[k]<=0)delete c.ps[k];
    if(S.hp>0)tickDots(c.ps,'You',dd=>{if(!S.flags.god)S.hp=Math.max(0,S.hp-dd);},'p');
    if(S.hp>0){c.myTurn=true;startTurn();}

function line(c,x0,y0,x1,y1,col,th=1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;c.fillStyle=col;

  if(i<n-1){c.fillStyle=cols[i+1];for(let y=b-2;y<b;y++)for(let x=y%2;x<W;x+=2)c.fillRect(x,y,1,1);}}}

const SBUF=document.createElement('canvas'),SBX=SBUF.getContext&&SBUF.getContext('2d',{willReadFrequently:true}),S2B={};
function scale2xTo(src,W,H,dst){const a=new Uint32Array(src.getImageData(0,0,W,H).data.buffer);const k=W+'x'+H;const o=S2B[k]||(S2B[k]=new ImageData(W*2,H*2));const b=new Uint32Array(o.data.buffer),W2=W*2;
  for(let y=0;y<H;y++){const r=y*W;for(let x=0;x<W;x++){const E=a[r+x],A=y?a[r-W+x]:E,D=y<H-1?a[r+W+x]:E,C=x?a[r+x-1]:E,B=x<W-1?a[r+x+1]:E,i=y*2*W2+x*2;
    b[i]=C===A&&C!==D&&A!==B?A:E;b[i+1]=A===B&&A!==C&&B!==D?B:E;b[i+W2]=D===C&&D!==B&&C!==A?C:E;b[i+W2+1]=B===D&&B!==A&&D!==C?D:E;}}
  dst.putImageData(o,0,0);}
// the star chart: k screen px per chart unit (smaller = more zoomed out), centred on the origin plus the pan
function starView(cv){const r=cv.getBoundingClientRect();const k=Math.max(1.3,Math.min(2.1,r.width/400))*(UI.szoom||1);return {r,k,W:r.width/k,H:r.height/k};}
function starScreen(cv,s){const {r,k,W,H}=starView(cv),pn=starPan();return {x:r.left+(s.x+W/2+pn.x)*k,y:r.top+(s.y+H/2+pn.y)*k};}
function drawStars(cv,t){const dpr=window.devicePixelRatio||1,{r,k,W,H}=starView(cv),pw=Math.round(r.width*dpr),ph=Math.round(r.height*dpr);if(!pw||!ph)return;
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}const c=cv.getContext('2d');if(!c)return;
  c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=false;c.drawImage(bgOf('stars0',256,190,x=>SCENES.stars.bg(x,0)),0,0,pw,ph);
  c.setTransform(k*dpr,0,0,k*dpr,0,0);SCENES.stars.fg(c,t,0,W,H);}
function drawScene(cv,t){const name=cv.dataset.scene;if(name==='stars'){drawStars(cv,t);return;}const v=+(cv.dataset.v||0);const sc=SCENES[name];if(!sc)return;const c=cv.getContext('2d');if(!c)return;
  if(!cv.dataset.hd||!SBX){c.imageSmoothingEnabled=false;c.drawImage(bgOf(name+v,256,sc.h,x=>sc.bg(x,v)),0,0);sc.fg(c,t,v);return;}
  if(SBUF.width!==256||SBUF.height!==sc.h){SBUF.width=256;SBUF.height=sc.h;}SBX.imageSmoothingEnabled=false;SBX.clearRect(0,0,256,sc.h);
  SBX.drawImage(bgOf(name+v,256,sc.h,x=>sc.bg(x,v)),0,0);sc.fg(SBX,t,v);scale2xTo(SBX,256,sc.h,c);}
function sceneHTML(name,v=0,extra=''){const sc=SCENES[name];const ps=PS();return `<div class="scenewrap" style="max-width:${256*ps}px">${extra}<canvas class="scene" data-scene="${name}" data-v="${v}" width="256" height="${sc.h}"></canvas></div>`;}
function sceneToScreen(cv,x,y){const r=cv.getBoundingClientRect();return {x:r.left+x/256*r.width,y:r.top+y/(cv.height/(cv.dataset.hd?2:1))*r.height};}

  return rows;}

  try{const blob=new Blob([JSON.stringify({game:'ashen-reach',at:new Date().toISOString(),S})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='el-juego-save.json';

const FXO=[];const GP=2,GU=3;
function fxo(dur,draw){FXO.push({t0:performance.now(),dur:TS(dur),draw});}
function pp(x,y,col,s){px.fillStyle=col;px.fillRect(Math.round(x/GP)*GP,Math.round(y/GP)*GP,s||GP,s||GP);}
function pline(x0,y0,x1,y1,col,s){const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/GP));for(let i=0;i<=n;i++)pp(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,col,s);}
function pdisc(x,y,r,col){for(let j=-r;j<=r;j+=GP)for(let i=-r;i<=r;i+=GP)if(i*i+j*j<=r*r)pp(x+i,y+j,col);}
function jagPts(x0,y0,x1,y1,n,amp){const p=[[x0,y0]];const nx=-(y1-y0),ny=x1-x0,l=Math.hypot(nx,ny)||1;for(let i=1;i<n;i++){const k=i/n,o=(Math.random()-.5)*amp;p.push([x0+(x1-x0)*k+nx/l*o,y0+(y1-y0)*k+ny/l*o]);}p.push([x1,y1]);return p;}
function pjag(pts,col,s){for(let i=1;i<pts.length;i++)pline(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1],col,s);}
// a blade arc that sweeps in, then its tail catches up
function arcFx(cx,cy,r,a0,a1,cols,dur,th=2,sy=1){fxo(dur,k=>{const head=Math.min(1,k*2.2),tail=Math.max(0,(k-.3)/.7);const n=Math.ceil(Math.abs(a1-a0)*r/GP);

    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*sy;if(u-tail<.25&&((i*7)%5)<(k>.5?3:1))continue;const hot=head-u<.07;
    pp(x,y,hot?'#ffffff':cols[0],GU*(1+Math.round(w*th)));pp(x-Math.cos(a)*GU,y-Math.sin(a)*GU*sy,hot?cols[1]:cols[1]);if(w>.6)pp(x+Math.cos(a)*GU,y+Math.sin(a)*GU*sy,'#ffffff');}});}
function streakFx(x0,y0,x1,y1,cols,dur,th=1){fxo(dur,k=>{const hd=Math.min(1,k*3),tl=Math.max(0,(k-.3)/.7);const ax=x0+(x1-x0)*tl,ay=y0+(y1-y0)*tl,bx=x0+(x1-x0)*hd,by=y0+(y1-y0)*hd;

function ringFx(x,y,r0,r1,cols,dur,sy=1){fxo(dur,k=>{const r=r0+(r1-r0)*k;const n=Math.max(8,Math.ceil(r*6.283/(GU*2)));for(let i=0;i<n;i++){const a=i/n*6.283;pp(x+Math.cos(a)*r,y+Math.sin(a)*r*sy,k<.5?cols[0]:cols[1]||cols[0]);}});}
const TRAIL={icicle:['#c4ecff','#6fb7e8'],fireball:['#e2782a','#f2c14e','#c43c3c'],ember:['#e2782a','#f2c14e'],meteor:['#e2782a','#f2c14e','#c43c3c','#5d5672'],lance:['#c4ecff','#6fb7e8'],lance3:['#c4ecff','#6fb7e8'],shard:['#c4ecff','#f4efe4'],zap:['#fff1a8','#f2c14e','#c08cff'],glob:['#6aa84f','#b6e36a']};

  if(k==='fireball'||k==='ember'||k==='meteor'){const r={ember:9,fireball:14,meteor:24}[k];for(let j=-r-8;j<=r+8;j+=GP)for(let i=-r-8;i<=r+8;i+=GP){const d=i*i+j*j;if(d>r*r&&d<=(r+8)*(r+8)&&((i+j)/GP&1)===f)pp(x+i,y+j,'#7a1f2b');}pdisc(x,y,r+(f?GP:0),'#c43c3c');pdisc(x,y,r-2,'#e2782a');pdisc(x+2,y-2,Math.max(3,r-6),'#f2c14e');pdisc(x+3,y-3,Math.max(2,r-10),'#fff1a8');return;}

  if(b.dataset.a!=='reset'&&b.dataset.a!=='resetNo')S._confirm=false;if(f(b.dataset.v,b)!=='async')render();});

  if(ev.target&&ev.target.id==='vol'){OPT.vol=+ev.target.value;saveOpt();if(AU.g)AU.g.gain.value=OPT.vol*.5;}});
document.addEventListener('change',ev=>{const t=ev.target;if(t&&t.id==='impf'&&t.files&&t.files[0])importFile(t.files[0]);if(t&&t.id==='vol')sfx('coin');});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&UI.set){UI.set=false;IMP=null;render(true);}});
document.addEventListener('focusin',ev=>{if(ev.target&&ev.target.id==='chatin')NET.chatFocus=true;});document.addEventListener('focusout',ev=>{if(ev.target&&ev.target.id==='chatin')NET.chatFocus=false;});
document.addEventListener('keydown',ev=>{const t=ev.target;if(t&&t.id==='nm'&&ev.key==='Enter'){ACT.begin();render();return;}if(t&&t.id==='chatin'&&ev.key==='Enter'){ev.preventDefault();chatSend();return;}if(t&&t.id==='pw'&&ev.key==='Enter'){ev.preventDefault();signInPw();return;}if(t&&t.id==='admc'&&ev.key==='Enter'){ev.preventDefault();admTry();return;}if(t&&t.id==='dcode'&&ev.key==='Enter'){ev.preventDefault();ACT.duelgo();return;}if((ev.key==='Enter'||ev.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName.toLowerCase()!=='button'){ev.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
/* star chart: drag to pan, tap to select, double-tap to light */
const starPan=()=>{UI.pan=UI.pan||{};const T=S&&S.starTab||'melee';return UI.pan[T]||(UI.pan[T]={x:0,y:70});};
let SDRAG=null,STAP={id:null,t:0};
const starAt=(cv,ev)=>{const {r,k,W,H}=starView(cv),pn=starPan(),x=(ev.clientX-r.left)/k-W/2-pn.x,y=(ev.clientY-r.top)/k-H/2-pn.y;let best=null,bd=64;
  for(const [id,s] of Object.entries(STARS)){if(s.tree!==(S.starTab||'melee'))continue;const d=(s.x-x)**2+(s.y-y)**2;if(d<bd){bd=d;best=id;}}return best;};
document.addEventListener('wheel',ev=>{const cv=ev.target.closest&&ev.target.closest('canvas[data-scene="stars"]');if(!cv)return;ev.preventDefault();UI.szoom=Math.max(.5,Math.min(2.5,(UI.szoom||1)*(ev.deltaY<0?1.1:1/1.1)));drawStars(cv,performance.now());},{passive:false});
document.addEventListener('pointerdown',ev=>{const cv=ev.target.closest&&ev.target.closest('canvas[data-scene="stars"]');if(!cv)return;SDRAG={x:ev.clientX,y:ev.clientY,moved:false,cv};cv.style.cursor='grabbing';});
document.addEventListener('pointermove',ev=>{const cv=document.querySelector('canvas[data-scene="stars"]');if(!cv)return;
  if(SDRAG){const {k}=starView(cv),dx=ev.clientX-SDRAG.x,dy=ev.clientY-SDRAG.y;if(SDRAG.moved||Math.abs(dx)+Math.abs(dy)>5){SDRAG.moved=true;const pn=starPan();
    pn.x=Math.max(-190,Math.min(190,pn.x+dx/k));pn.y=Math.max(-170,Math.min(210,pn.y+dy/k));SDRAG.x=ev.clientX;SDRAG.y=ev.clientY;drawStars(cv,performance.now());}return;}
  if(ev.target===cv)SCN.hover=starAt(cv,ev);});
document.addEventListener('pointerup',ev=>{const d=SDRAG;SDRAG=null;if(!d)return;d.cv.style.cursor='grab';if(d.moved)return;const id=starAt(d.cv,ev);if(!id)return;const now=Date.now();
  if(STAP.id===id&&now-STAP.t<450){STAP={id:null,t:0};if(Date.now()>=busyUntil&&canLight(id)){fxAt=0;ACT.selstar(id);ACT.light(id);render();}return;}
  STAP={id,t:now};sfx('ui');ACT.selstar(id);render();});
const setHover=ev=>{const t=ev.target&&ev.target.closest?ev.target.closest('.hot'):null;SCN.hover=t?t.dataset.v:null;};
document.addEventListener('pointerover',setHover);document.addEventListener('focusin',setHover);
document.addEventListener('pointermove',ev=>{const cv=document.querySelector('canvas[data-scene="sanctum"]');if(!cv){SCN.mouse=null;return;}const r=cv.getBoundingClientRect();SCN.mouse={x:(ev.clientX-r.left)/r.width*256,y:(ev.clientY-r.top)/r.height*120};});

function start(data){S=(data&&data.S)||load();if(!S)S=fresh();S=migrate(S);buildChart();render();if(SUPA.url&&SUPA.key)net();
  requestAnimationFrame(loop);requestAnimationFrame(sceneLoop);}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
